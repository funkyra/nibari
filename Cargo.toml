[package]
name = "nibari"
version = "1.0.2"
edition = "2024"
rust-version = "1.97.0"

[dependencies]
anyhow = "1.0"
calloop-wayland-source = "0.4.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cosmic-text = "0.18"
freedesktop-icons = "0.4"
log = "0.4"
niri-ipc = "26.4"
resvg = { version = "0.47", default-features = false }
serde = { version = "1.0", features = ["derive"] }
smithay-client-toolkit = "0.20"
system-tray = "0.8"
tiny-skia = "0.12"
tokio = { version = "1.0", features = ["rt", "sync"] }
toml = "0.9"
wayland-client = "0.31"
zbus = { version = "5.0", features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
