[package]
name = "nibari"
version = "1.0.2"
edition = "2024"
rust-version = "1.97.0"

[dependencies]
anyhow = "1.0.104"
calloop-wayland-source = "0.4.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cosmic-text = "0.19.0"
freedesktop-icons = "0.4.0"
log = "0.4.34"
niri-ipc = "26.4.0"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = "0.21.1"
system-tray = "0.8.9"
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
toml = "1.1.4"
wayland-client = "0.31.15"
zbus = { version = "5.19.0", features = ["tokio"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
