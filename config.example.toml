# ~/.config/nibari/config.toml

[bar]
# Colors use #RRGGBB or #RRGGBBAA.
height = 24
font_family = "Fira Code Retina"
font_size = 12.5
background = "#211B1BD8"
foreground = "#FFF2E3FF"
icon_foreground = "#FFF2E3FF"
icon_muted = "#D5BCADFF"
padding = 4

[workspaces]
width = 24
focused_background = "#211B1B00"
active_background = "#211B1B00"
active_foreground = "#FFB66EFF"
occupied_foreground = "#FFF2E3FF"
empty_foreground = "#D5BCADFF"
urgent_foreground = "#FF9C83FF"

[tasks]
enabled = true
icon_size = 18
spacing = 8
padding = 6
background = "#211B1B00"
focused_background = "#211B1B00"
urgent_background = "#211B1B00"
foreground = "#FFF2E3FF"
focused_foreground = "#FFB66EFF"

[media]
enabled = true

[tray]
icon_size = 16
spacing = 6
drawer = true
drawer_duration_ms = 200

[menu]
# Tray item context menus.
background = "#211B1BFA"
foreground = "#FFF2E3FF"
muted = "#D5BCADFF"
accent = "#FFB66EFF"
border = "#976A5AFF"

[clock]
format = "%a %b %d, %H:%M"
position = "center"

[calendar]
enabled = true
background = "#211B1BFA"
foreground = "#FFF2E3FF"
header = "#FFB66EFF"
weekday = "#FFF2E3FF"
weekend = "#FF9C83FF"
muted = "#D5BCADFF"
today_background = "#FFB66EFF"
today_foreground = "#211B1BFF"
border = "#976A5AFF"

[weather]
enabled = false
# An empty location uses the city detected from the external IP address.
location = ""
# latitude = 60.1695
# longitude = 24.9354
units = "metric"
refresh_minutes = 15
background = "#211B1BFA"
foreground = "#FFF2E3FF"
muted = "#D5BCADFF"
accent = "#FFB66EFF"
border = "#976A5AFF"

[bluetooth]
# Requires BlueZ; audio controls also require PipeWire and pactl.
enabled = true
background = "#211B1BFA"
foreground = "#FFF2E3FF"
muted = "#D5BCADFF"
accent = "#FFB66EFF"
border = "#976A5AFF"

[network]
enabled = true
interface = ""
ping_target = "1.1.1.1"
background = "#211B1BFA"
foreground = "#FFF2E3FF"
muted = "#D5BCADFF"
accent = "#FFB66EFF"
border = "#976A5AFF"

[icons]
# theme = "Papirus"
